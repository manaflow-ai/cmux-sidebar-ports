name: "CLA Assistant v2"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    # Run every non-closed pull request event through the live preflight.
    types: [opened,closed,edited,reopened,synchronize]

# Deny permissions by default. Each job grants only the API access it needs.
permissions: {}

jobs:
  CLAAssistant:
    name: "CLA Assistant v2"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The maintained action leaves failed-check recovery to a separate
      # exact-head rerun worker. Keep recovery advisory until that worker exists.
      actions: read
      contents: write
      issues: write
      # GitHub's pull_request_target token denied issue comments for fork PRs
      # with this set to read, despite the endpoint documentation allowing
      # issues:write. Keep write until that live behavior changes.
      pull-requests: write
    # Serialize signature work for this pull request only. GitHub keeps one
    # running and one pending run for this repository/PR group by default.
    concurrency:
      group: cla-signatures-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.action != 'closed'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.state == 'open' &&
        github.event.issue.pull_request &&
        (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      )
    steps:
      - name: "Verify pull request identity and commit history"
        # Verify the live pull request identity and state because issue_comment
        # has no pull request payload to compare.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          EVENT_BASE_REPO_FULL_NAME: ${{ github.event.pull_request.base.repo.full_name }}
          EVENT_BASE_REPO_ID: ${{ github.event.pull_request.base.repo.id }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=CLA preflight failed::Invalid pull request number."
            exit 1
          fi

          pr_endpoint="repos/${GH_REPO}/pulls/${PR_NUMBER}"
          if ! pr_json="$(gh api "${pr_endpoint}" --jq '{base_ref: .base.ref, base_repo_full_name: .base.repo.full_name, base_repo_id: .base.repo.id, head_ref: .head.ref, head_sha: .head.sha, head_repo_full_name: .head.repo.full_name, head_repo_id: .head.repo.id, state: .state, merged: (.merged_at != null), commits: .commits}' 2>/dev/null)"; then
            echo "::error title=CLA preflight failed::Unable to query pull request ${PR_NUMBER}."
            exit 1
          fi

          if ! live_base_repo_full_name="$(jq -er '.base_repo_full_name | strings' <<<"${pr_json}" 2>/dev/null)" || [[ -z "${live_base_repo_full_name}" ]]; then
            echo "::error title=CLA identity preflight failed::GitHub returned no valid base repository name for pull request ${PR_NUMBER}."
            exit 1
          fi
          if ! live_base_repo_id="$(jq -er '.base_repo_id | numbers' <<<"${pr_json}" 2>/dev/null)" || ! [[ "${live_base_repo_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=CLA identity preflight failed::GitHub returned no positive base repository ID for pull request ${PR_NUMBER}."
            exit 1
          fi
          if ! live_head_repo_full_name="$(jq -er '.head_repo_full_name | strings' <<<"${pr_json}" 2>/dev/null)" || [[ -z "${live_head_repo_full_name}" ]]; then
            echo "::error title=CLA identity preflight failed::GitHub returned no valid head repository name for pull request ${PR_NUMBER}."
            exit 1
          fi
          if ! live_head_repo_id="$(jq -er '.head_repo_id | numbers' <<<"${pr_json}" 2>/dev/null)" || ! [[ "${live_head_repo_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=CLA identity preflight failed::GitHub returned no positive head repository ID for pull request ${PR_NUMBER}."
            exit 1
          fi
          if ! live_head_sha="$(jq -er '.head_sha | strings' <<<"${pr_json}" 2>/dev/null)" || [[ -z "${live_head_sha}" ]] || ! [[ "${live_head_sha}" =~ ^[0-9A-Fa-f]+$ ]]; then
            echo "::error title=CLA identity preflight failed::GitHub returned no valid head commit for pull request ${PR_NUMBER}."
            exit 1
          fi
          if ! live_head_ref="$(jq -er '.head_ref | strings' <<<"${pr_json}" 2>/dev/null)" || [[ -z "${live_head_ref}" ]]; then
            echo "::error title=CLA identity preflight failed::GitHub returned no valid head ref for pull request ${PR_NUMBER}."
            exit 1
          fi

          if [[ "${live_base_repo_full_name}" != "${GH_REPO}" ]]; then
            echo "::error title=CLA identity policy::Pull request ${PR_NUMBER} targets ${live_base_repo_full_name}, not ${GH_REPO}."
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
            if [[ -z "${EVENT_HEAD_SHA}" || -z "${EVENT_HEAD_REF}" || -z "${EVENT_HEAD_REPO_FULL_NAME}" || -z "${EVENT_BASE_REPO_FULL_NAME}" || -z "${EVENT_BASE_REF}" ]]; then
              echo "::error title=CLA identity preflight failed::The pull_request_target payload is missing head or base repository identity for pull request ${PR_NUMBER}."
              exit 1
            fi
            if ! [[ "${EVENT_HEAD_REPO_ID}" =~ ^[1-9][0-9]*$ ]] || ! [[ "${EVENT_BASE_REPO_ID}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error title=CLA identity preflight failed::The pull_request_target payload has an invalid repository ID for pull request ${PR_NUMBER}."
              exit 1
            fi
            if ! [[ "${EVENT_HEAD_SHA}" =~ ^[0-9A-Fa-f]+$ ]]; then
              echo "::error title=CLA identity preflight failed::The pull_request_target payload has an invalid head commit for pull request ${PR_NUMBER}."
              exit 1
            fi
            if [[ "${EVENT_HEAD_SHA}" != "${live_head_sha}" ]]; then
              echo "::error title=CLA identity policy::The pull_request_target head commit is stale for pull request ${PR_NUMBER}."
              exit 1
            fi
            if [[ "${EVENT_HEAD_REF}" != "${live_head_ref}" ]]; then
              echo "::error title=CLA identity policy::The pull_request_target head ref is stale for pull request ${PR_NUMBER}."
              exit 1
            fi
            if [[ "${EVENT_HEAD_REPO_FULL_NAME}" != "${live_head_repo_full_name}" || "${EVENT_HEAD_REPO_ID}" != "${live_head_repo_id}" ]]; then
              echo "::error title=CLA identity policy::The pull_request_target head repository identity is stale for pull request ${PR_NUMBER}."
              exit 1
            fi
            if [[ "${EVENT_BASE_REPO_FULL_NAME}" != "${live_base_repo_full_name}" || "${EVENT_BASE_REPO_ID}" != "${live_base_repo_id}" ]]; then
              echo "::error title=CLA identity policy::The pull_request_target base repository identity is stale for pull request ${PR_NUMBER}."
              exit 1
            fi
          fi

          if ! base_ref="$(jq -er '.base_ref | strings' <<<"${pr_json}" 2>/dev/null)"; then
            echo "::error title=CLA preflight failed::GitHub returned no valid base branch for pull request ${PR_NUMBER}."
            exit 1
          fi
          if [[ "${base_ref}" != "main" ]]; then
            echo "::error title=CLA base branch policy::CLA Assistant only accepts pull requests targeting main."
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "pull_request_target" && "${EVENT_BASE_REF}" != "${base_ref}" ]]; then
            echo "::error title=CLA identity policy::The pull_request_target base ref is stale for pull request ${PR_NUMBER}."
            exit 1
          fi

          if ! state="$(jq -er '.state | strings' <<<"${pr_json}" 2>/dev/null)"; then
            echo "::error title=CLA preflight failed::GitHub returned no valid state for pull request ${PR_NUMBER}."
            exit 1
          fi
          if [[ "${state}" != "open" ]]; then
            echo "::error title=CLA state policy::Pull request ${PR_NUMBER} is not open."
            exit 1
          fi

          if ! merged="$(jq -r '.merged' <<<"${pr_json}" 2>/dev/null)" || [[ "${merged}" != "false" ]]; then
            echo "::error title=CLA state policy::Pull request ${PR_NUMBER} is already merged or has an invalid merge state."
            exit 1
          fi

          if ! commits="$(jq -er '.commits | numbers | select(. >= 0 and . == floor) | tostring' <<<"${pr_json}" 2>/dev/null)"; then
            echo "::error title=CLA commit preflight failed::GitHub returned no valid commit count for pull request ${PR_NUMBER}."
            exit 1
          fi
          if ! [[ "${commits}" =~ ^[0-9]+$ ]]; then
            echo "::error title=CLA commit preflight failed::GitHub returned an invalid commit count for pull request ${PR_NUMBER}."
            exit 1
          fi
          max_commits=1000
          if (( ${#commits} > ${#max_commits} )) ||
            { (( ${#commits} == ${#max_commits} )) && (( 10#${commits} > 10#${max_commits} )); }; then
            echo "::error title=CLA commit limit exceeded::This pull request reports ${commits} commits. The maintained CLA action has a hard limit of ${max_commits} commits. Split the pull request before requesting CLA verification."
            exit 1
          fi

      - name: "Reject non-exact CLA comment"
        # GitHub expression equality is case-insensitive. Validate the raw
        # comment in the shell before invoking the action. This keeps the
        # event admission case-sensitive even if expression semantics change.
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "issue_comment" ]]; then
            exit 0
          fi
          shopt -u nocasematch
          case "${COMMENT_BODY}" in
            recheck|"I have read the CLA Document and I hereby sign the CLA")
              ;;
            *)
              echo "::error title=CLA comment policy::Use exactly the documented CLA signing sentence or the exact recheck command."
              exit 1
              ;;
          esac

      - name: "Reject historical CLA comment mismatches"
        # Inspect bounded history before invoking the action. Reject broad
        # signing phrases and spoofed bot markers, while allowing the
        # canonical marker identity generated by the action.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=CLA comment history lookup::Invalid pull request number."
            exit 1
          fi

          comments_endpoint="repos/${GH_REPO}/issues/${PR_NUMBER}/comments"
          exact_comment='i have read the cla document and i hereby sign the cla'
          broad_pattern='^.*i \s*have \s*read \s*the \s*cla \s*document \s*and \s*i \s*hereby \s*sign \s*the \s*cla.*$'
          PAGE_COUNT=0

          inspect_page() {
            local page="$1"
            local page_json candidate_count
            PAGE_COUNT=""
            if ! page_json="$(gh api "${comments_endpoint}?per_page=100&page=${page}" --jq '.' 2>/dev/null)"; then
              return 1
            fi
            if ! PAGE_COUNT="$(jq -er 'if type == "array" then length else error("comments response is not an array") end' <<<"${page_json}" 2>/dev/null)"; then
              return 1
            fi
            if ! [[ "${PAGE_COUNT}" =~ ^[0-9]+$ ]] || (( PAGE_COUNT > 100 )); then
              return 1
            fi
            if ! candidate_count="$(jq -er \
              --arg exact "${exact_comment}" \
              --arg broad_pattern "${broad_pattern}" \
              '
                if type != "array" then
                  error("comments response is not an array")
                else
                  [
                    .[] |
                    .body as $body |
                    if ($body | type) != "string" then
                      error("comment body is not a string")
                    else
                      ($body | ascii_downcase | gsub("^\\s+|\\s+$"; "")) as $normalized |
                      ($body | ascii_downcase | contains("cla assistant lite bot")) as $marker_present |
                      select(($normalized | test($broad_pattern)) or $marker_present) |
                      (.user.login // "") as $login |
                      (.user.type // "") as $type |
                      (.user.id // 0) as $user_id |
                      if (($login | type) != "string" or ($type | type) != "string") then
                        error("comment author is malformed")
                      else
                        (if ($login | endswith("[bot]")) then true else false end) as $bot_login |
                        ($login == "github-actions[bot]" and $type == "Bot" and $user_id == 41898282 and $marker_present) as $is_canonical_bot |
                        select(($is_canonical_bot | not) and ($marker_present or (($normalized != $exact) or ($type != "User") or ($bot_login) or ($login == ""))))
                      end
                    end
                  ] | length
                end
              ' <<<"${page_json}" 2>/dev/null)"; then
              return 1
            fi
            if ! [[ "${candidate_count}" =~ ^[0-9]+$ ]]; then
              return 1
            fi
            if (( candidate_count > 0 )); then
              return 2
            fi
          }

          total_comments=0
          for page in {1..10}; do
            if inspect_page "${page}"; then
              :
            else
              status=$?
              if (( status == 2 )); then
                echo "::error title=CLA comment policy::A historical comment matches the archived CLA phrase but is not an exact human signature."
              else
                echo "::error title=CLA comment history lookup::Unable to validate historical comments for page ${page}."
              fi
              exit 1
            fi
            total_comments=$((total_comments + PAGE_COUNT))
            if (( PAGE_COUNT < 100 )); then
              echo "Historical CLA comments checked: ${total_comments}"
              exit 0
            fi
          done

          if inspect_page 11; then
            overflow_count="${PAGE_COUNT}"
          else
            status=$?
            if (( status == 2 )); then
              echo "::error title=CLA comment policy::A historical comment matches the archived CLA phrase but is not an exact human signature."
            else
              echo "::error title=CLA comment history lookup::Unable to validate the historical comment overflow page."
            fi
            exit 1
          fi
          if (( overflow_count > 0 )); then
            echo "::error title=CLA comment history limit::This pull request has more than 1000 comments; historical CLA validation stopped safely."
            exit 1
          fi
          echo "Historical CLA comments checked: ${total_comments}"

      - name: "CLA Assistant v2"
        # The action handles signing and status updates. Merged pull requests
        # use the separate lock job below so one job owns lock requests.
        uses: manaflow-ai/cla-github-action@09d64fa8ba8b77ae253f354be6e1564d49317fa3 # reviewed in-org hardening, source and dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          # Pin the agreement to the commit that defines this workflow. If
          # the terms change, update this workflow and use a new signatures
          # version so existing signatures remain tied to the old terms.
          path-to-document: 'https://github.com/manaflow-ai/cmux-sidebar-ports/blob/${{ github.workflow_sha }}/CLA.md'
          # Keep locking in the explicit job below, which supplies a valid
          # reason and fails on API errors.
          lock-pullrequest-aftermerge: 'false'
          # signatures live on the unprotected cla-signatures branch so required checks on main don't block the bot's signature commits
          branch: 'cla-signatures'
          # Require the exact sentence documented in CLA.md in the action too.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          required-base-ref: 'main'
          require-opener-as-author: 'true'

  LockMergedPullRequest:
    name: "Lock merged pull request"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: read
    # Keep merged-PR locking isolated to this repository and pull request.
    # The live closed+merged preflight below is the only lock admission gate.
    concurrency:
      group: cla-lock-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_STATE: ${{ github.event.pull_request.state }}
      EVENT_MERGED: ${{ github.event.pull_request.merged }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      EVENT_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
      EVENT_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
      EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
      EVENT_BASE_REPO_FULL_NAME: ${{ github.event.pull_request.base.repo.full_name }}
      EVENT_BASE_REPO_ID: ${{ github.event.pull_request.base.repo.id }}
    steps:
      - name: "Lock merged pull request"
        run: |
          set -euo pipefail
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=CLA lock preflight failed::Invalid pull request number."
            exit 1
          fi
          if [[ "${EVENT_ACTION}" != "closed" || "${EVENT_STATE}" != "closed" || "${EVENT_MERGED}" != "true" ]]; then
            echo "::error title=CLA lock preflight failed::The close event is not a merged pull request event."
            exit 1
          fi
          if [[ "${EVENT_BASE_REF}" != "main" || -z "${EVENT_BASE_REPO_FULL_NAME}" || -z "${EVENT_HEAD_REF}" || -z "${EVENT_HEAD_REPO_FULL_NAME}" ]]; then
            echo "::error title=CLA lock preflight failed::The close event has incomplete repository identity."
            exit 1
          fi
          if ! [[ "${EVENT_BASE_REPO_ID}" =~ ^[1-9][0-9]*$ ]] || ! [[ "${EVENT_HEAD_REPO_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=CLA lock preflight failed::The close event has an invalid repository ID."
            exit 1
          fi
          if ! [[ "${EVENT_HEAD_SHA}" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error title=CLA lock preflight failed::The close event has an invalid head commit."
            exit 1
          fi

          pr_endpoint="repos/${GH_REPO}/pulls/${PR_NUMBER}"
          if ! pr_json="$(gh api "${pr_endpoint}" --jq '{state: .state, merged: (.merged_at != null), base_ref: .base.ref, base_repo_full_name: .base.repo.full_name, base_repo_id: .base.repo.id, head_ref: .head.ref, head_sha: .head.sha, head_repo_full_name: .head.repo.full_name, head_repo_id: .head.repo.id}' 2>/dev/null)"; then
            echo "::error title=CLA lock preflight failed::Unable to query the live pull request state."
            exit 1
          fi
          json_field() {
            jq -er "$1" <<<"${pr_json}" 2>/dev/null
          }
          if ! live_state="$(json_field '.state')" || [[ "${live_state}" != "closed" ]]; then
            echo "::error title=CLA lock preflight failed::The live pull request is not closed."
            exit 1
          fi
          if ! live_merged="$(json_field '.merged')" || [[ "${live_merged}" != "true" ]]; then
            echo "::error title=CLA lock preflight failed::The live pull request is not merged."
            exit 1
          fi
          if ! live_base_ref="$(json_field '.base_ref | strings')" || [[ "${live_base_ref}" != "main" ]]; then
            echo "::error title=CLA lock preflight failed::The live pull request does not target main."
            exit 1
          fi
          if ! live_base_repo_full_name="$(json_field '.base_repo_full_name | strings')" || [[ "${live_base_repo_full_name}" != "${GH_REPO}" ]]; then
            echo "::error title=CLA lock preflight failed::The live pull request targets a different repository."
            exit 1
          fi
          if ! live_base_repo_id="$(json_field '.base_repo_id | numbers')" || ! [[ "${live_base_repo_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=CLA lock preflight failed::The live pull request has an invalid base repository ID."
            exit 1
          fi
          if ! live_head_ref="$(json_field '.head_ref | strings')" || [[ -z "${live_head_ref}" ]]; then
            echo "::error title=CLA lock preflight failed::The live pull request has no valid head ref."
            exit 1
          fi
          if ! live_head_sha="$(json_field '.head_sha | strings')" || ! [[ "${live_head_sha}" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error title=CLA lock preflight failed::The live pull request has no valid head commit."
            exit 1
          fi
          if ! live_head_repo_full_name="$(json_field '.head_repo_full_name | strings')" || [[ -z "${live_head_repo_full_name}" ]]; then
            echo "::error title=CLA lock preflight failed::The live pull request has no valid head repository name."
            exit 1
          fi
          if ! live_head_repo_id="$(json_field '.head_repo_id | numbers')" || ! [[ "${live_head_repo_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=CLA lock preflight failed::The live pull request has an invalid head repository ID."
            exit 1
          fi
          if [[ "${live_base_repo_full_name}" != "${EVENT_BASE_REPO_FULL_NAME}" ||
            "${live_base_repo_id}" != "${EVENT_BASE_REPO_ID}" ||
            "${live_base_ref}" != "${EVENT_BASE_REF}" ||
            "${live_head_ref}" != "${EVENT_HEAD_REF}" ||
            "${live_head_sha}" != "${EVENT_HEAD_SHA}" ||
            "${live_head_repo_full_name}" != "${EVENT_HEAD_REPO_FULL_NAME}" ||
            "${live_head_repo_id}" != "${EVENT_HEAD_REPO_ID}" ]]; then
            echo "::error title=CLA lock preflight failed::The close event does not match the live pull request identity."
            exit 1
          fi

          issue_endpoint="repos/${GH_REPO}/issues/${PR_NUMBER}"
          lock_endpoint="${issue_endpoint}/lock"
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            echo "::error title=CLA lock preflight failed::Unable to query the lock state for pull request ${PR_NUMBER}."
            exit 1
          fi
          if [[ "${locked}" == "true" ]]; then
            echo "Pull request ${PR_NUMBER} is already locked"
            exit 0
          fi
          if [[ "${locked}" != "false" ]]; then
            echo "::error title=CLA lock preflight failed::GitHub returned an invalid lock state for pull request ${PR_NUMBER}."
            exit 1
          fi
          if ! gh api --method PUT \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${lock_endpoint}" \
            --field lock_reason=resolved >/dev/null 2>&1; then
            echo "::error title=CLA lock failed::Unable to lock merged pull request ${PR_NUMBER}."
            exit 1
          fi
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            echo "::error title=CLA lock verification failed::Unable to verify the lock state for pull request ${PR_NUMBER}."
            exit 1
          fi
          if [[ "${locked}" != "true" ]]; then
            echo "::error title=CLA lock verification failed::Merged pull request ${PR_NUMBER} is not locked."
            exit 1
          fi
